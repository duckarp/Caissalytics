name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign only (checks the signing key); do not publish a release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Holds the RELEASE_SIGNING_KEY secret; protect it with required reviewers in the repo settings
    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install build tools (zip)
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build and Test
        run: dotnet test --configuration Release

      - name: Publish Linux x64
        run: |
          dotnet publish Caissalytics/Caissalytics.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish-linux-x64
          tar -czf Caissalytics-linux-x64.tar.gz -C ./publish-linux-x64 Caissalytics

      - name: Publish Windows x64
        run: |
          dotnet publish Caissalytics/Caissalytics.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o ./publish-win-x64
          cd publish-win-x64 && zip ../Caissalytics-win-x64.zip Caissalytics.exe && cd ..

      - name: Sign release archives
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set. The app's updater rejects unsigned releases, so none is published."
            exit 1
          fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > signing-key.pem
          for f in Caissalytics-linux-x64.tar.gz Caissalytics-win-x64.zip; do
            openssl dgst -sha256 -sign signing-key.pem -out "$f.sig" "$f"
            # Must verify with the public key the app embeds, or installed copies would refuse the update
            openssl dgst -sha256 -verify release-signing-public-key.pem -signature "$f.sig" "$f"
          done
          rm -f signing-key.pem

      - name: Create GitHub Release
        # Manual runs default to a dry run: everything up to signing, nothing published
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Caissalytics-linux-x64.tar.gz
            Caissalytics-linux-x64.tar.gz.sig
            Caissalytics-win-x64.zip
            Caissalytics-win-x64.zip.sig
          generate_release_notes: true
