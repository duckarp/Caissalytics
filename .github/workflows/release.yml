name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install build tools (zip)
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build and Test
        run: dotnet test --configuration Release

      - name: Publish Linux x64
        run: |
          dotnet publish Caissalytics/Caissalytics.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -o ./publish-linux-x64
          tar -czf Caissalytics-linux-x64.tar.gz -C ./publish-linux-x64 .

      - name: Publish Windows x64
        run: |
          dotnet publish Caissalytics/Caissalytics.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -o ./publish-win-x64
          cd publish-win-x64 && zip -r ../Caissalytics-win-x64.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Caissalytics-linux-x64.tar.gz
            Caissalytics-win-x64.zip
          generate_release_notes: true
